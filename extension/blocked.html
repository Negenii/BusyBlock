<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Blocked · BusyBlock</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    main { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .card { width: min(440px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 32px; text-align: center; }
    .bar { width: 72px; height: 16px; margin: 0 auto 24px; border-radius: 4px; background: var(--accent); box-shadow: 0 0 24px color-mix(in srgb, var(--accent) 55%, transparent); }
    h1 { font-size: 22px; margin: 0 0 6px; }
    .host { margin: 0 0 20px; }
    .time { font-size: 44px; font-weight: 600; letter-spacing: -0.02em; margin: 8px 0 0; font-variant-numeric: tabular-nums; }
    .sub { margin: 4px 0 0; }
    .done .bar { background: #30a46c; box-shadow: none; }
  </style>
</head>
<body>
  <main>
    <div class="card" id="card">
      <div class="bar"></div>
      <h1 id="title">BUSY. Stay on it.</h1>
      <p class="host muted mono" id="host"></p>
      <p class="time" id="time"></p>
      <p class="sub muted" id="sub">until the bar timer ends</p>
    </div>
  </main>
  <script src="shared.js"></script>
  <script src="blocked.js"></script>
</body>
</html>
