<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Blocked · BusyBlock</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    main { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .card { width: min(560px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px 32px 32px; text-align: center; }
    .device { margin: 0 auto 18px; }
    [hidden] { display: none !important; }
    h1 { font-size: 22px; margin: 0 0 6px; }
    .host { margin: 0 0 16px; }
    .time { font-size: 44px; font-weight: 600; letter-spacing: -0.02em; margin: 4px 0 0; font-variant-numeric: tabular-nums; }
    .sub { margin: 4px 0 0; }
    .done .time { color: #30a46c; }
  </style>
</head>
<body>
  <main>
    <div class="card" id="card">
      <div class="device idle" id="device" hidden>
        <img src="brand/busybar-device.png" alt="BUSY Bar">
        <canvas id="panel" width="720" height="160"></canvas>
      </div>
      <h1 id="title">BUSY. Stay on it.</h1>
      <p class="host muted mono" id="host"></p>
      <p class="time" id="time" hidden></p>
      <p class="sub muted" id="sub">until the bar timer ends</p>
    </div>
  </main>
  <script src="shared.js"></script>
  <script src="led.js"></script>
  <script src="blocked.js"></script>
</body>
</html>
